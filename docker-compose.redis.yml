name: tempo-redis

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "devredis"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Traduce el REST API de Upstash a comandos Redis.
  srh:
    image: hiett/serverless-redis-http:latest
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: devtoken
      SRH_CONNECTION_STRING: "redis://:devredis@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
