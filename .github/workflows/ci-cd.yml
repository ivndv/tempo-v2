name: Tempo CI/CD

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}

jobs:
  # 1. Lint y formato
  lint:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Biome CI
        run: bunx biome ci .

  # 2. Typecheck
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

  # 3. Tests unitarios
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: bun run test:unit

  # 4. Integración + E2E
  #    Supabase efímero en el runner. Solo develop o manual.
  integration:
    name: Integration + E2E (Supabase efímero)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      # No usa tu Supabase local, staging ni producción.
      - name: Start ephemeral Supabase
        run: >-
          bunx supabase start
          -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Export ephemeral Supabase env
        shell: bash
        run: |
          eval "$(bunx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' | sed 's/^/export /')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"

      - name: Reset ephemeral database from migrations
        run: bunx supabase db reset

      - name: Run integration tests
        run: bun run test:integration

      - name: Build app for E2E
        run: bun run build

      # Cachea binarios de Chromium, no paquetes de Bun.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Stop ephemeral Supabase
        if: always()
        run: bunx supabase stop --no-backup

  # 5. Deploy a Cloudflare
  #    Solo push a main. Requiere CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
  deploy:
    name: Deploy to Cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Build for Cloudflare Workers
        run: bun run cf:build

      - name: Deploy to Cloudflare Workers
        run: bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # 6. Escaneo de secretos
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
